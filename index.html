<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Copilot</title>
    <script src="scripts/script.js" defer></script>
    <style>
        :root {
            --wc-yellow: #f6c231;
            --wc-yellow-dark: #dda815;
            --wc-green: #2ecc71;
            --wc-green-dark: #27ae60;
            --wc-text: #33333a;
            --wc-text-light: #8b8b93;
            --wc-icon: #a3a3ab;
            --wc-border: #ececef;
            --wc-bg: #ffffff;
            --wc-track-off: #d8d8dd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 300px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--wc-bg);
            color: var(--wc-text);
            padding: 14px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--wc-border);
        }

        .header img {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            object-fit: contain;
        }

        .header h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .header .badge {
            margin-left: auto;
            font-size: 10px;
            font-weight: 600;
            color: var(--wc-green-dark);
            background: #e8f9ef;
            padding: 3px 8px;
            border-radius: 20px;
        }

        .card {
            border: 1px solid var(--wc-border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
        }

        .row + .row {
            border-top: 1px solid var(--wc-border);
        }

        .row-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            color: var(--wc-icon);
        }

        .row-text {
            flex: 1;
            min-width: 0;
        }

        .row-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 16px;
        }

        .row-sub {
            font-size: 11px;
            color: var(--wc-text-light);
            line-height: 14px;
            margin-top: 2px;
        }

        .switch {
            position: relative;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
            position: absolute;
        }

        .switch .track {
            position: absolute;
            inset: 0;
            background: var(--wc-track-off);
            border-radius: 20px;
            transition: background .15s ease;
        }

        .switch .thumb {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: transform .15s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
        }

        .switch input:checked + .track {
            background: var(--wc-yellow);
        }

        .switch input:checked + .track .thumb {
            transform: translateX(16px);
        }

        button.action {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 40px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            color: #fff;
            transition: filter .15s ease, transform .05s ease;
        }

        button.action svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        button.action:active {
            transform: scale(0.98);
        }

        button.action:hover {
            filter: brightness(1.06);
        }

        #btn_fill_now {
            background: var(--wc-green);
            margin-bottom: 8px;
        }

        #btn_refresh {
            background: var(--wc-yellow);
            color: #4a3b00;
        }

        #btn_refresh:disabled {
            background: #ececef;
            color: #b3b3ba;
            cursor: not-allowed;
            filter: none;
        }

        .footer {
            text-align: center;
            font-size: 10px;
            color: #c2c2c8;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="./images/logo.png" alt="Web Copilot">
        <h1>Web Copilot</h1>
        <span class="badge">grátis</span>
    </div>

    <div class="card">
        <div class="row">
            <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2.5" y="5" width="19" height="14" rx="2.2"/>
                <circle cx="8" cy="12" r="2"/>
                <line x1="13" y1="10" x2="18" y2="10"/>
                <line x1="13" y1="14" x2="17" y2="14"/>
            </svg>
            <div class="row-text">
                <div class="row-title">Autocompletar</div>
                <div class="row-sub">Preencher dados automaticamente</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="WC_autocomplete">
                <span class="track"><span class="thumb"></span></span>
            </label>
        </div>
        <div class="row">
            <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9.5"/>
                <path d="M9.4 9.2a2.6 2.6 0 1 1 3.5 2.4c-.9.4-1.5 1-1.5 2.1"/>
                <circle cx="11.4" cy="16.6" r="0.15" fill="currentColor" stroke="none"/>
            </svg>
            <div class="row-text">
                <div class="row-title">Sugestões</div>
                <div class="row-sub">Mostrar dica ao passar o mouse</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="WC_show_suggestions">
                <span class="track"><span class="thumb"></span></span>
            </label>
        </div>
    </div>

    <button class="action" id="btn_fill_now">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 19.5 15 9"/>
            <path d="M13 4l.8 1.7L15.5 6.5l-1.7.8L13 9l-.8-1.7L10.5 6.5l1.7-.8z"/>
            <path d="M19 12.5l.5 1 1 .5-1 .5-.5 1-.5-1-1-.5 1-.5z"/>
        </svg>
        <span>Preencher agora</span>
    </button>
    <button class="action" id="btn_refresh" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11A8 8 0 0 0 6 5.3L4 7"/>
            <path d="M4 4v3.5h3.5"/>
            <path d="M4 13a8 8 0 0 0 14 5.7L20 17"/>
            <path d="M20 20v-3.5h-3.5"/>
        </svg>
        <span>Aplicar alterações</span>
    </button>

    <div class="footer">Gera dados de teste — nunca use em produção real.</div>

</body>
</html>
